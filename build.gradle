// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext{
        kotlin = '1.6.10'
        kotlinx = "1.6.4"
        agp = "8.4.1"
    }
    repositories {
        maven {
            url "http://192.168.50.6:8081/artifactory/mg-app-libs-release/"
            allowInsecureProtocol true
        }
        maven {
            url "http://192.168.50.6:8081/artifactory/mg-app-libs-snapshot/"
            allowInsecureProtocol true
        }
        google()
        jcenter()
        mavenCentral()
        mavenLocal()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$agp"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin"
        classpath 'org.jfrog.buildinfo:build-info-extractor-gradle:5.2.0'
    }
}

allprojects {
    repositories {
        maven {
            url "http://192.168.50.6:8081/artifactory/mg-app-libs-release/"
            allowInsecureProtocol true
        }
        maven {
            url "http://192.168.50.6:8081/artifactory/mg-app-libs-snapshot/"
            allowInsecureProtocol true
        }
        maven {
            url " http://211.91.57.96:8081/artifactory/mg-app-libs-snapshot/"
            allowInsecureProtocol true
        }
        maven {
            url " http://211.91.57.96:8081/artifactory/mg-app-libs-release/"
            allowInsecureProtocol true
        }

        google()
        jcenter()
        maven {
            url "https://dl.bintray.com/osborn/Android"
        }
        mavenCentral()
        mavenLocal()
    }


