apply plugin: 'com.android.application'

android {
    signingConfigs {
        debug {
            storeFile file('..\\keystore.jks')
            storePassword 'justin'
            keyAlias 'justin'
            keyPassword 'justin'
        }
    }
    compileSdk build_sdk_version

    namespace "com.github.penfeizhou.animation.demo"

    defaultConfig {
        applicationId "com.github.penfeizhou.animation.demo"
        minSdk min_api_level
        targetSdk target_api_level
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        signingConfig signingConfigs.debug
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }

    buildFeatures{
        buildConfig = true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.1'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation "androidx.vectordrawable:vectordrawable-animated:1.1.0"

    implementation("com.moorgen.controls:frameanimation:${rootProject.ext.Version}")
    implementation("com.moorgen.controls:awebp:${rootProject.ext.Version}")
    implementation("com.moorgen.controls:apng:${rootProject.ext.Version}")
    implementation("com.moorgen.controls:gif:${rootProject.ext.Version}")
    implementation("com.moorgen.controls:awebpencoder:${rootProject.ext.Version}")
    implementation("com.moorgen.controls:plugin_glide:${rootProject.ext.Version}")

//    implementation project(':frameanimation')
//    implementation project(':plugin_glide')
//    implementation project(':awebp')
//    implementation project(':apng')
//    implementation project(':gif')
//    implementation project(':awebpencoder')


    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'
//    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.3'

    testImplementation 'junit:junit:4.13'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
}
