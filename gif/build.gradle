apply plugin: 'com.android.library'


ext{
    package_name = 'com.moorgen.controls'
    artifactVersion = "${Version}"//release git包发布的版本
    artifactGroup = "gif"
    artifactFilePath  = "${project.buildDir}/outputs/aar/${project.name}-" +
            "${(artifactVersion.endsWith('SNAPSHOT') || artifactVersion.endsWith('snapshot'))?'debug':'release'}.aar"
}

android {
    compileSdk build_sdk_version

    namespace "com.github.penfeizhou.animation.gif"
    defaultConfig {
        minSdkVersion min_api_level
        targetSdkVersion target_api_level
        versionCode 1
        versionName "1.0"
        ndkVersion "26.1.10909125"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        externalNativeBuild {
            cmake {
                cppFlags "-fPIC"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            consumerProguardFiles 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "androidx.vectordrawable:vectordrawable-animated:1.1.0"
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation("com.moorgen.controls:frameanimation:${rootProject.ext.Version}")

//    api project(":frameanimation")

    testImplementation 'junit:junit:4.13'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
}


task generateSourcesJar(type: Jar) {
    from android.sourceSets.main.java.srcDirs
    def  classifier = 'sources'
    archiveClassifier.convention(classifier)
    archiveClassifier.set(classifier)
}

afterEvaluate {
    if(!artifactVersion.endsWith('SNAPSHOT') && !artifactVersion.endsWith('snapshot')){
        tasks.matching {
            (it.name.endsWith('artifactoryPublish'))
        }.each { tk ->
            tk.dependsOn('assembleRelease', 'generateSourcesJar')
        }
    }
}

//apply from: rootProject.file('scripts/upload.gradle')
apply from: '../local-maven.gradle'